<!doctype html><meta charset="utf-8"><title>Spell Hearts Online</title><style>*{box-sizing:border-box}body{margin:0;background:#080913;color:#fff3c9;font-family:Georgia,"Yu Mincho",serif;text-align:center}#board{position:relative;margin:15px auto;width:min(1256px,100vw);aspect-ratio:1.67;background:url('assets/battlefield.webp') center/103% 103%;overflow:hidden}.side{position:absolute;top:8%;width:18%;font-size:clamp(13px,2vw,26px);font-weight:bold;text-shadow:2px 2px #000}.red{left:5%;color:#ffaaa0}.blue{right:5%;color:#a9e7ff}.area{position:absolute;top:12%;width:17%;min-height:48%;padding:6px;background:#0007;border:1px solid #d8b957}.left{left:14%}.right{right:14%}.center{position:absolute;left:35%;top:15%;width:30%;font-size:clamp(12px,1.8vw,23px)}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:12px}.card{width:48%;aspect-ratio:.58;border:1px solid #d8b957;background:#15101b;color:#fff;cursor:pointer;padding:0;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}.spell{width:90%}.muted{opacity:.55}.ok{padding:10px 20px;background:#dcae35;border:0;border-radius:6px;font-weight:bold;cursor:pointer}.panel{max-width:700px;margin:12px auto}.hide{display:none}input,button{font:inherit;padding:8px}.log{min-height:28px;color:#e7c76e}.grave img{width:24%;height:90px;object-fit:cover;margin:2px}.charge img{width:48%;height:120px;object-fit:cover}</style><div id="lobby" class="panel"><h1>SPELL HEARTS ONLINE</h1><p>赤側が部屋を作成し、青側は同じ部屋コードで参加します。</p><input id="room" placeholder="部屋コード（空欄で作成）"><button onclick="connect('p')">赤側で作成</button><button onclick="connect('c')">青側で参加</button></div><div id="game" class="hide"><div id="board"><div id="red" class="side red"></div><div id="blue" class="side blue"></div><div id="left" class="area left"></div><div id="right" class="area right"></div><div class="center"><div id="message"></div><p id="log" class="log"></p><button id="draw" class="ok" onclick="send('draw')">始まりのスペルをドロー</button><button id="ok" class="ok" onclick="send('ok')">OK!</button></div></div></div><script>const A='assets/',images={rock:'rock.webp',scissors:'scissors.webp',paper:'paper.webp',amplify:'amplify.webp',pursuit:'pursuit.webp',block:'block.webp',scheme:'scheme.webp'},names={rock:'グー',scissors:'チョキ',paper:'パー',amplify:'アンプリファイア',pursuit:'追い打ち',block:'ブロック',scheme:'謀略'};let ws,state;function connect(side){let room=document.querySelector('#room').value.trim();ws=new WebSocket(`ws://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({type:'join',room,side}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){history.replaceState({},'',`?room=${m.room}&side=${m.side}`);document.querySelector('#lobby').classList.add('hide');document.querySelector('#game').classList.remove('hide')}if(m.type==='state'){state=m.state;render()}if(m.type==='error')alert(m.message)}}function send(type,card){ws?.send(JSON.stringify({type,card}))}function img(k){return `<img src="${A+images[k]}">`}function player(w){return w===state.side?state.me:state.opponent}function render(){let me=state.me,op=state.opponent,red=state.side==='p'?me:op,blue=state.side==='c'?me:op;document.querySelector('#red').textContent=`RED HP ${red.hp}/10`;document.querySelector('#blue').textContent=`BLUE HP ${blue.hp}/10`;let left=state.side==='p'?me:op,right=state.side==='c'?me:op;document.querySelector('#left').innerHTML=panel(left,true);document.querySelector('#right').innerHTML=panel(right,false);document.querySelector('#message').textContent=state.phase==='pick'?`ROUND ${state.round} ― バトルカードを選択`:state.phase==='opening'?'始まりのスペルカードをドローして下さい':state.battle?`${names[state.battle.a]} 対 ${names[state.battle.b]}`:state.phase==='end'?state.log:'スペルを使用するか選択';document.querySelector('#log').textContent=state.log;document.querySelector('#draw').classList.toggle('hide',state.phase!=='opening'||!!me.spell);document.querySelector('#ok').classList.toggle('hide',!state.canOk||state.ok);document.querySelector('#ok').textContent=state.opponentOk?'相手OK・あなたもOK':'OK!'}function panel(s,isMe){let spell=isMe?s.spell:(s.hasSpell?'back':null),hand=isMe&&state.phase==='pick'?`<div class="cards">${state.hand.map(k=>`<button class="card" onclick="send('pick','${k}')">${img(k)}</button>`).join('')}</div>`:'';let use=isMe&&state.canUse?`<button class="card spell" onclick="send('use')">${img(s.spell)}</button>`:spell&&spell!=='back'?`<div class="card spell">${img(spell)}</div>`:spell?'<div class="card spell muted">伏せスペル</div>':'<p>スペルなし</p>';return `<b>${isMe?'あなた':'相手'}</b><div class="charge">${s.amp==='charged'?img('amplify'):''}</div>${hand}${use}<div class="grave">${s.grave.map(img).join('')}${s.ampGrave?img('amplify'):''}</div>`}let q=new URLSearchParams(location.search);if(q.get('room')){document.querySelector('#room').value=q.get('room');connect(q.get('side')||'c')}</script>
