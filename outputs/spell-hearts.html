<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spell Hearts</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07101b;color:#fff3cf;font-family:Georgia,'Yu Mincho',serif}.hide{display:none!important}button,input{font:inherit;color:#fff3cf;background:#11131ccc;border:1px solid #d4af45;border-radius:6px;padding:.65em 1em;cursor:pointer}#title,#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#06101be8;z-index:9}.menu,.panel{width:min(420px,90vw);padding:28px;border:1px solid #d4af45;border-radius:12px;background:#0a0b13;text-align:center}.menu h1{letter-spacing:.16em;color:#ffe69d}.menu button{display:block;width:100%;margin:12px 0}#app{width:min(1200px,96vw);margin:18px auto}.top{display:flex;justify-content:space-between;align-items:center}.board{display:grid;grid-template-columns:minmax(160px,1fr) minmax(250px,1.4fr) minmax(160px,1fr);gap:16px;min-height:620px;padding:18px;border:2px solid #d4af45;border-radius:14px;background:#080d18 url('assets/battlefield-transparent.webp') center/cover}.side{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr;gap:8px;align-content:start}.name,.hp{grid-column:1/3;text-align:center;font-weight:bold}.hp{font-size:1.5rem}.red{color:#ffaaa1}.blue{color:#a9e9ff}.slot{min-height:210px;position:relative;border:1px dashed #d4af45;border-radius:8px;background:#06070dbb;overflow:hidden}.slot label{position:absolute;left:0;right:0;bottom:0;padding:6px;text-align:center;background:#050509e8;color:#ffe993}.deck{grid-column:1/3;min-height:90px;display:grid;place-items:center;border:1px solid #d4af45;border-radius:8px;background:#05060ab8}.hand{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}.hand button{padding:0;min-height:94px}.hand button:before{content:'✦';font-size:2rem}.mark{height:100%;display:grid;place-items:center;font-size:3rem;color:#e9c85a}.mark small{position:absolute;bottom:35px;font-size:1rem}.field{display:grid;place-items:center;align-content:center;text-align:center;gap:20px}.field h2{font-size:clamp(1.5rem,3vw,2.5rem);letter-spacing:.1em}.reveal{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(360px,100%)}.card{min-height:220px;border:1px solid #d4af45;border-radius:8px;background:#0b0d16d9;display:grid;place-items:center;font-size:2rem}.message{min-height:4em}@media(max-width:720px){#app{width:100%;margin:0}.board{grid-template-columns:1fr 1fr;min-height:0;padding:8px}.field{grid-column:1/3;grid-row:1}.side{grid-row:2}.slot{min-height:145px}}</style><section id="title"><div class="menu"><h1>SPELL HEARTS</h1><button id="story">STORY MODE</button><button id="cpu">CPU戦</button><button id="online">オンライン対戦</button></div></section><main id="app" class="hide"><header class="top"><h1>SPELL HEARTS</h1><button id="home">タイトルに戻る</button></header><section class="board"><section class="side"><div id="rn" class="name red"></div><div id="rh" class="hp red"></div><div id="rb" class="slot"></div><div id="rs" class="slot"></div><div id="rd" class="deck"></div></section><section class="field"><h2>SPELL HEARTS</h2><div id="reveal" class="reveal"></div><p id="msg" class="message"></p></section><section class="side"><div id="bn" class="name blue"></div><div id="bh" class="hp blue"></div><div id="bb" class="slot"></div><div id="bs" class="slot"></div><div id="bd" class="deck"></div></section></section></main><div id="overlay" class="hide"></div><script>var g;var overlay=document.getElementById('overlay');var $=function(i){return document.getElementById(i)};var names={rock:'グー',scissors:'チョキ',paper:'パー'};function random(){var a=['rock','scissors','paper'];return a[Math.floor(Math.random()*3)]}function mine(k){return(document.body.dataset.me||g.me)===k}function put(id,html){$(id).innerHTML=html}function battle(k){var choice=k==='r'?g.rp:g.bp;return choice?'<div class="mark">'+names[choice]+'<small>'+((g.phase==='reveal')?'OK!':'バトルカード')+'</small></div>':'<div class="mark">?</div><label>バトル山札</label>'}function show(k){var s=g[k],a=k==='r'?['rn','rh','rb','rs','rd']:['bn','bh','bb','bs','bd'];$(a[0]).textContent=s.name||k;$(a[1]).textContent='HP '+s.hp+' / 10';put(a[2],battle(k));put(a[3],'<div class="mark">✦</div><label>'+(s.spell&&s.spell.name||'スペルカード')+'</label>');var deck=$(a[4]);deck.textContent='';if(g.phase==='open'&&mine(k)&&!s.hand){var b=document.createElement('button');b.textContent='バトルカードを引く';b.onclick=function(){SH.draw(k)};deck.appendChild(b)}else deck.textContent=g.phase==='open'?(mine(k)?'カードを選択':'相手を待っています'):'';if(g.phase==='open'&&mine(k)&&s.hand){var h=document.createElement('div');h.className='hand';s.hand.forEach(function(x){var b=document.createElement('button');b.textContent=names[x];b.onclick=function(){SH.pick(k,x)};h.appendChild(b)});$(a[2]).innerHTML='';$(a[2]).appendChild(h);var l=document.createElement('label');l.textContent='1枚選ぶ';$(a[2]).appendChild(l)}}function render(){if(!g)return;show('r');show('b');$('msg').textContent=g.msg||'';$('reveal').innerHTML=g.phase==='reveal'&&g.rp&&g.bp?'<div class="card">'+names[g.rp]+'</div><div class="card">'+names[g.bp]+'</div>':''}window.SHRender=render;function end(){var a=g.rp,b=g.bp;if(a===b)g.msg='あいこ。もう一度。';else{var w=(a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock');if(w){g.b.hp--;g.msg='勝利！ 青に1ダメージ。'}else{g.r.hp--;g.msg='敗北。 赤に1ダメージ。'}}g.phase='open';g.rp=null;g.bp=null;render()}window.SH={home:function(){location.reload()},story:function(){this.cpu()},cpu:function(){document.body.dataset.me='r';g={r:{name:'あなた',hp:10},b:{name:'CPU',hp:10},me:'r',phase:'open',msg:'赤側のバトル山札を引いてください。'};$('title').classList.add('hide');$('app').classList.remove('hide');render()},online:function(){if(window.SHOnline)window.SHOnline.open()},draw:function(k){if(g.online)return window.SHOnline.controller.draw();g[k].hand=[random(),random(),random(),random()];g.msg='バトルカードを1枚選んでください。';render()},pick:function(k,x){if(g.online)return window.SHOnline.controller.pick(x);g.rp=x;g.bp=random();g.phase='reveal';g.msg='両者のカードを公開。';render();setTimeout(end,800)}};$('story').onclick=function(){SH.story()};$('cpu').onclick=function(){SH.cpu()};$('online').onclick=function(){SH.online()};$('home').onclick=function(){SH.home()};</script><script src="spell-hearts-online-client.js?v=rebuild-v10"></script></html>
