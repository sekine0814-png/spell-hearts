function runDamage(effect){if(effect.started)return;effect.started=true;let stage=document.querySelector('.stage');if(effect.damage.c)stage.insertAdjacentHTML('beforeend',effectMarkup('aura-to-c'));if(effect.damage.p)stage.insertAdjacentHTML('beforeend',effectMarkup('aura-to-p'));setTimeout(()=>{if(g.damageEffect!==effect)return;for(let k of ['p','c'])if(effect.damage[k]){let hp=document.querySelector('#'+k+'Hp');hp.classList.remove('hp-hit');void hp.offsetWidth;hp.classList.add('hp-hit');setTimeout(()=>hp.classList.remove('hp-hit'),440)}let timer=setInterval(()=>{let done=true;for(let k of ['p','c'])if(g.visualHp[k]!==effect.to[k]){g.visualHp[k]+=Math.sign(effect.to[k]-g.visualHp[k]);document.querySelector('#'+k+'Hp').textContent=`HP ${g.visualHp[k]} / 10`;done=false}if(done){clearInterval(timer);setTimeout(()=>{if(g.damageEffect!==effect)return;g.visualHp=null;g.damageEffect=null;document.querySelectorAll('.damage-aura').forEach(x=>x.remove());if(g.p.hp===0||g.c.hp===0)g.phase='end';else{g.round++;g.phase='pick';g.chooser=true;g.now=null}render()},130)}},120)},620)}
function runPreviewAura(effect){if(effect.started)return;effect.started=true;let stage=document.querySelector('.stage');if(effect.damage.c)stage.insertAdjacentHTML('beforeend','<div class="damage-aura preview-aura aura-to-c"></div>');if(effect.damage.p)stage.insertAdjacentHTML('beforeend','<div class="damage-aura preview-aura aura-to-p"></div>');setTimeout(()=>document.querySelectorAll('.preview-aura').forEach(x=>x.remove()),760)}
function battleZone(){if(!g.chooser){let ready=g.phase==='spell'&&g.cpuSpellReady&&!g.pOk;return `<button class="deck-button${ready?' ok-ready':''}" onclick="openBattle()">${img('red-battle-back.png')}${ready?'<span class="ok-label">OK!</span>':''}</button>`}let hand=Object.entries(cards).filter(([k])=>k!=='amplify'||g.p.amp==='ready');return `<div class="picks${hand.length===3?' three-picks':''}">${hand.map(([k,v])=>`<button class="pick" title="${cardTip(k)}" ${g.phase!=='pick'?'disabled':''} onclick="pick('${k}')">${img(battleCardImage(k,v.i))}</button>`).join('')}</div>`}
function render(){let p=g.p,c=g.c,n=g.now;for(let [id,s]of[['p',p],['c',c]]){document.querySelector('#'+id+'Hp').textContent=`HP ${s.hp} / 10`;document.querySelector('#'+id+'Bar').style.width=s.hp*10+'%'}document.querySelector('#pBattle').innerHTML=battleZone();document.querySelector('#cBattle').innerHTML=`<b>BATTLE CARD</b>${img('blue-battle-back.jpg')}`;document.querySelector('#cBattle img').className='spell-back';document.querySelector('#pSpell').innerHTML=`<b>SPELL CARD</b>${p.spell?img('red-spell-back.png'):'<div>山札なし</div>'}`;document.querySelector('#cSpell').innerHTML=`<b>SPELL CARD</b>${c.spell?img('blue-spell-back.jpg'):'<div>山札なし</div>'}`;for(let id of ['pSpell','cSpell']){let x=document.querySelector('#'+id+' img');if(x)x.className='spell-back'}document.querySelector('#pPlayed').innerHTML=n?img(battleCardImage(n.a,cards[n.a].i)):img('red-battle-back.png');document.querySelector('#cPlayed').innerHTML=n?img(cards[n.b].i):img('blue-battle-back.jpg');document.querySelector('#pGrave').innerHTML=p.grave.map(k=>img(spells[k].i)).join('');document.querySelector('#cGrave').innerHTML=c.grave.map(k=>img(spells[k].i)).join('');let msg=g.phase==='pick'?`ROUND ${g.round} ― バトルカードを選択`:g.phase==='spell'?(n.r==='draw'?'あいこ。':n.r==='p'?'あなたの勝利！':'CPUの勝利。'):(p.hp===0&&c.hp===0?'DRAW GAME':p.hp===0?'CPU WINS':'YOU WIN');document.querySelector('#message').textContent=msg+(p.amp==='charged'?' ⚡赤アンプリファイア・チャージ中':'')+(c.amp==='charged'?' ⚡青アンプリファイア・チャージ中':'');document.querySelector('#spellInfo').innerHTML=p.spell?`伏せスペル（あなたのみ確認）：<strong>${spells[p.spell].n}</strong> ― ${spells[p.spell][p.amp==='charged'?'x':'a']}`:'伏せスペルはありません';document.querySelector('#actions').innerHTML=g.phase==='spell'?`${allowed('p')?`<button class="btn" onclick="use('p');render()">${spells[p.spell].n}${p.amp==='charged'?'（強化）':''}を使う</button>`:''}<button class="btn pass" onclick="endRound()">結果を確定</button>`:'';document.querySelector('#log').innerHTML=g.logs.map(x=>`<li>${x}</li>`).join('')}
const baseRender=render;render=function(){baseRender();document.querySelector('#pSpell').innerHTML=g.p.deck.length?img('red-spell-back.png'):'<div class="empty-deck">EMPTY</div>';document.querySelector('#cSpell').innerHTML=g.c.deck.length?img('blue-spell-back.jpg'):'<div class="empty-deck">EMPTY</div>';for(let id of ['pSpell','cSpell']){let x=document.querySelector('#'+id+' img');if(x)x.className='spell-back'}if(!document.querySelector('#pCharge'))document.querySelector('.stage').insertAdjacentHTML('beforeend','<div id="pCharge" class="charge p-charge charge-top"></div><div id="cCharge" class="charge c-charge charge-top"></div><div id="pChargeSpell" class="charge p-charge charge-spell"></div><div id="cChargeSpell" class="charge c-charge charge-spell"></div>');document.querySelector('#pCharge').innerHTML=g.p.amp==='charged'?`<img src="${A+cards.amplify.i}" title="${cardTip('amplify')}">`:'';document.querySelector('#cCharge').innerHTML=g.c.amp==='charged'?`<img src="${A+cards.amplify.i}" title="${cardTip('amplify')}">`:'';document.querySelector('#pChargeSpell').innerHTML=g.p.spell?`<img src="${A+spells[g.p.spell].i}">`:'';let activeSpell=document.querySelector('#pChargeSpell img');if(activeSpell)activeSpell.title=spellTip(g.p.spell,g.p.amp==='charged');document.querySelector('#cChargeSpell').innerHTML=g.c.spell?img('blue-spell-back.jpg'):'';if(g.now){document.querySelector('#pPlayed').title=cardTip(g.now.a);document.querySelector('#cPlayed').title=cardTip(g.now.b)}if(!g.now){document.querySelector('#pPlayed').innerHTML='';document.querySelector('#cPlayed').innerHTML=''}for(let [id,s] of [['pGrave',g.p],['cGrave',g.c]])document.querySelectorAll('#'+id+' img').forEach((el,i)=>el.title=`${spells[s.grave[i]].n}：${spells[s.grave[i]].a}`)};
const interfaceRender=render;render=function(){interfaceRender();let drew=false;for(let w of ['p','c'])if(g.drawEffect&&g.drawEffect[w]){let target=document.querySelector('#'+(w==='p'?'pChargeSpell':'cChargeSpell'));target.classList.remove('spell-draw');void target.offsetWidth;target.classList.add('spell-draw');setTimeout(()=>target.classList.remove('spell-draw'),1100);g.drawEffect[w]=false;drew=true}if(drew)playCardFlip();let deck=document.querySelector('#pSpell');if(g.phase==='opening'){document.querySelector('#message').textContent='最初のスペルカードをドローしてください';deck.onclick=drawInitial;deck.style.cursor='pointer';deck.title='クリックして最初のスペルカードをドロー';document.querySelector('#actions').innerHTML='<button class="btn" onclick="drawInitial()">最初のスペルをドロー</button>'}else{deck.onclick=null;deck.style.cursor='default';deck.title=''}};

const ampRender=render;render=function(){ampRender();for(let w of ['p','c']){let box=document.querySelector('#'+w+'Charge'),show=g[w].amp==='charged'&&g.ampDisplay&&g.ampDisplay[w];box.innerHTML=show?img(cards.amplify.i):'';box.classList.toggle('amp-arriving',!!(show&&g.ampArriving[w]))}};
const cpuThinkRender=render;render=function(){cpuThinkRender();let message=document.querySelector('#message'),thinking=g.phase==='thinking';message.classList.toggle('cpu-thinking',thinking);if(thinking)message.textContent='CPUが思考中…'};
const cpuSpellRender=render;render=function(){cpuSpellRender();let blueDeck=document.querySelector('#cBattle'),ready=g.phase==='spell'&&g.cpuSpellReady&&!g.cOk,spellThinking=g.phase==='spell'&&!g.cpuSpellReady;blueDeck.classList.toggle('cpu-ready',ready);blueDeck.querySelector('.ok-label')?.remove();if(ready)blueDeck.insertAdjacentHTML('beforeend','<span class="ok-label">OK!</span>');if(spellThinking){document.querySelector('#message').textContent='CPUがスペルを検討中…';document.querySelector('#message').classList.add('cpu-thinking')}if(spellThinking&&g.cpuSpellRound!==g.round){g.cpuSpellRound=g.round;thinkCpuSpell(g)}};

const chargedSpellUse=use;use=function(w){let enhanced=!!(g&&g[w]&&g[w].amp==='charged'&&allowed(w)),charge=w==='p'?'#pCharge':'#cCharge',grave=w==='p'?'#pGrave':'#cGrave';chargedSpellUse(w);if(enhanced){setTimeout(()=>{slideCard(charge,grave,A+cards.amplify.i);playCardFlip()},80);setTimeout(()=>{g[w].ampGrave=true;render()},1420)}};

const openingPromptRender=render;render=function(){openingPromptRender();let message=document.querySelector('#message'),opening=g.phase==='opening',selecting=g.phase==='pick';message.classList.toggle('opening-draw',opening);document.querySelector('#pSpell').classList.toggle('opening-spell-deck',opening);document.querySelector('#cSpell').classList.toggle('opening-spell-deck',opening);message.classList.remove('battle-select-prompt');if(opening)message.textContent='始まりのスペルカードをドローして下さい';if(selecting)message.innerHTML=`ROUND ${g.round} ― <span class="battle-select-prompt">バトルカードを選択</span>`};

const spellNoticeRender=render;render=function(){spellNoticeRender();let message=document.querySelector('#message'),notice=g.spellAnnouncement,old=document.querySelector('#spellEffectMessage'),backdrop=document.querySelector('#spellEffectBackdrop');message.classList.remove('spell-announcement');old?.remove();if(notice){if(!backdrop){backdrop=document.createElement('div');backdrop.id='spellEffectBackdrop';backdrop.className='spell-effect-backdrop';document.body.append(backdrop)}let effect=document.createElement('div');effect.id='spellEffectMessage';effect.className=`spell-effect-message ${notice.side}-side`;let [headline,...detail]=notice.text.split('\n');effect.innerHTML=`<strong>${headline}</strong><span>${detail.join(' ')}</span>`;document.body.append(effect)}else backdrop?.remove()};
let resultSoundPlayed=false;const resultRender=render;render=function(){resultRender();let result=document.querySelector('#resultScreen');if(!result){result=document.createElement('div');result.id='resultScreen';document.body.append(result)}if(g.phase==='end'){let red=g.p.hp>g.c.hp,blue=g.c.hp>g.p.hp;result.innerHTML=`<div class="result-stack"><div class="result-word ${red?'result-red':blue?'result-blue':'result-draw'}">${red?'RED WIN':blue?'BLUE WIN':'DRAW GAME'}</div><div class="result-actions"><button class="result-retry" onclick="restartCpuMatch()">もう一度対戦</button><button class="result-retry" onclick="returnToTitle()">タイトルに戻る</button></div></div>`;if(!resultSoundPlayed){resultSoundPlayed=true;playWinFanfare()}requestAnimationFrame(()=>result.classList.add('show'))}else{resultSoundPlayed=false;result.classList.remove('show');result.innerHTML=''}};

const battleBgmTracks=['assets/forgotten-city.mp3','assets/memoria.mp3','assets/ice-chain.mp3','assets/melancholy.mp3'];function stopBgm(){let bgm=document.querySelector('#battleBgm');if(bgm){bgm.pause();bgm.currentTime=0}}function restartFromTitle(){stopBgm();start();document.querySelector('#titleScreen').classList.remove('dismiss')}function restartCpuMatch(){start();document.querySelector('#titleScreen').classList.add('dismiss');startBgm()}function returnToTitle(){stopBgm();location.href=location.pathname}function confirmReturnToTitle(){let dialog=document.querySelector('#titleReturnConfirm');if(!dialog){dialog=document.createElement('div');dialog.id='titleReturnConfirm';dialog.innerHTML='<div class="title-return-box" role="dialog" aria-modal="true" aria-label="タイトルに戻る確認"><p>タイトル画面に戻りますか？</p><div class="title-return-actions"><button type="button" data-answer="yes">はい</button><button type="button" data-answer="no">いいえ</button></div></div>';document.body.append(dialog);dialog.addEventListener('click',event=>{let answer=event.target.dataset.answer;if(answer==='yes')returnToTitle();if(answer==='no'||event.target===dialog)dialog.classList.remove('show')})}dialog.classList.add('show')}function startBgm(){let bgm=document.querySelector('#battleBgm');if(!bgm)return;let track=battleBgmTracks[Math.floor(Math.random()*battleBgmTracks.length)];bgm.pause();bgm.src=track;bgm.load();bgm.play().catch(()=>{})}async function enterGame(){if(window.ensureSpellHeartsGuest&&!(await window.ensureSpellHeartsGuest()))return;document.querySelector('#titleScreen').classList.add('dismiss');startBgm()}function showLoginNotice(){if(window.openSpellHeartsLogin){window.openSpellHeartsLogin();return}let note=document.querySelector('#roomNote');note.textContent='ログイン画面を準備しています。もう一度押してください。';}async function enterRoomPreview(e){e.preventDefault();let code=document.querySelector('#roomCode').value.trim(),note=document.querySelector('#roomNote');if(!code){note.textContent='合言葉を入力してください';return}if(window.ensureSpellHeartsGuest&&!(await window.ensureSpellHeartsGuest()))return;startBgm();if(window.beginOnlineMatch)window.beginOnlineMatch(code);else note.textContent='対戦サーバーに接続できません。';}start();document.addEventListener('DOMContentLoaded',()=>{let sound=document.querySelector('#pursuitSfx');if(sound)sound.volume=.8});
</script><audio id="battleBgm" src="assets/forgotten-city.mp3" loop preload="auto"></audio><audio id="cardFlipSfx" src="assets/card-flip.mp3" preload="auto"></audio><audio id="pursuitSfx" src="assets/pursuit-sfx.mp3" preload="auto"></audio><audio id="blockSfx" src="assets/block-sfx.mp3" preload="auto"></audio><audio id="schemeSfx" src="assets/scheme-sfx.mp3" preload="auto"></audio><audio id="damageSfxOne" src="assets/damage-1.mp3" preload="auto"></audio><audio id="damageSfxTwo" src="assets/damage-2.mp3" preload="auto"></audio><audio id="winFanfare" src="assets/win-fanfare.mp3" preload="auto"></audio><script>const battleBgm=document.querySelector('#battleBgm'),cardFlipSfx=document.querySelector('#cardFlipSfx'),pursuitSfx=document.querySelector('#pursuitSfx'),blockSfx=document.querySelector('#blockSfx'),schemeSfx=document.querySelector('#schemeSfx'),winFanfare=document.querySelector('#winFanfare'),damageSfx=[document.querySelector('#damageSfxOne'),document.querySelector('#damageSfxTwo')];battleBgm.volume=.28;cardFlipSfx.volume=.62;pursuitSfx.volume=.7;blockSfx.volume=.7;schemeSfx.volume=.7;winFanfare.volume=.78;damageSfx.forEach(sound=>sound.volume=.72);function playCardFlip(){cardFlipSfx.currentTime=0;cardFlipSfx.play().catch(()=>{})}function playPursuit(){pursuitSfx.currentTime=0;pursuitSfx.play().catch(()=>{})}function playBlock(){blockSfx.currentTime=0;blockSfx.play().catch(()=>{})}function playScheme(){schemeSfx.currentTime=0;schemeSfx.play().catch(()=>{})}function playWinFanfare(){winFanfare.currentTime=0;winFanfare.play().catch(()=>{})}function playDamageSfx(delay=0){setTimeout(()=>{let sound=damageSfx[Math.floor(Math.random()*damageSfx.length)];sound.currentTime=0;sound.play().catch(()=>{})},delay)}</script></body></html>
