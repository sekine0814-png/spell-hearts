<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spell Hearts</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07101b url('assets/title-screen.webp') center/cover fixed;color:#fff4d0;font-family:Georgia,'Yu Mincho',serif}.hide{display:none!important}button,input{font:inherit}button{cursor:pointer;color:#fff4d0;border:1px solid #d9b34e;background:#15151ddd;border-radius:7px;padding:.65em 1em}button:hover{filter:brightness(1.25)}#title,#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#06101bd9;z-index:10}.menu,.panel{width:min(420px,90vw);padding:28px;border:1px solid #d9b34e;border-radius:12px;background:#090b13ee;text-align:center;box-shadow:0 0 32px #000}.menu h1{letter-spacing:.16em;color:#ffe5a0}.menu button{display:block;width:100%;margin:12px 0;font-size:1.1rem}.panel input{display:block;width:100%;margin:10px 0;padding:.7em;background:#070910;color:#fff4d0;border:1px solid #d9b34e;border-radius:6px}#app{width:min(1280px,96vw);margin:22px auto}.top{display:flex;justify-content:space-between;align-items:center}.top h1{letter-spacing:.12em;margin:.25em 0}.board{display:grid;grid-template-columns:minmax(150px,1fr) minmax(260px,1.5fr) minmax(150px,1fr);gap:14px;min-height:680px;padding:18px;border:2px solid #d9b34e;border-radius:14px;background:#071018df url('assets/battlefield-transparent.webp') center/cover;box-shadow:0 0 30px #000}.side{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr;gap:8px;align-content:start}.name{grid-column:1/3;text-align:center;font-weight:bold;font-size:1.15rem}.hp{grid-column:1/3;text-align:center;font-weight:bold;font-size:1.5rem}.red{color:#ffaaa1}.blue{color:#a9e9ff}.slot{min-height:210px;position:relative;border:1px dashed #c8a845;border-radius:8px;background:#070910aa;overflow:hidden}.slot label{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:5px;background:#050509e8;color:#ffe993;text-align:center}.slot>button{border:0;border-radius:0;padding:0;width:100%;height:100%;background:#0a0c12}.slot img{width:100%;height:100%;object-fit:cover}.deck{grid-column:1/3;min-height:105px;text-align:center;padding:12px;border:1px solid #c8a845;border-radius:8px;background:#070910cc}.deck button{min-width:140px}.field{display:grid;place-items:center;text-align:center;align-content:center;gap:20px}.field h2{font-size:clamp(1.3rem,3vw,2.4rem);letter-spacing:.1em;text-shadow:0 0 15px #e5a52a}.reveal{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(390px,100%)}.reveal .card{min-height:230px}.card{border:1px solid #d9b34e;border-radius:8px;background:#080a11e8;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}.message{min-height:3em;font-size:1.1rem}.hand{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.hand button{padding:0;aspect-ratio:2/3}.hand button img{width:100%;height:100%;object-fit:cover}.ok{display:grid;place-items:center;font-size:2rem;color:#ffe77b;text-shadow:0 0 14px #ff8b29}@media(max-width:720px){#app{width:100%;margin:0}.board{grid-template-columns:1fr 1fr;min-height:0;padding:8px}.field{grid-column:1/3;grid-row:1}.side{grid-row:2}.slot{min-height:145px}.deck{min-height:70px}.top{padding:0 8px}.top h1{font-size:1.2rem}}</style><section id="title"><div class="menu"><h1>SPELL HEARTS</h1><button onclick="SH.story()">STORY MODE</button><button onclick="SH.cpu()">CPU戦</button><button onclick="SH.online()">オンライン対戦</button></div></section><main id="app" class="hide"><header class="top"><h1>SPELL HEARTS</h1><button onclick="SH.home()">タイトルに戻る</button></header><section class="board"><section class="side"><div id="rn" class="name red">赤</div><div id="rh" class="hp red">HP 10 / 10</div><div id="rb" class="slot"></div><div id="rs" class="slot"></div><div id="rd" class="deck"></div></section><section class="field"><h2>Spell Hearts</h2><div id="reveal" class="reveal"></div><p id="msg" class="message"></p></section><section class="side"><div id="bn" class="name blue">青</div><div id="bh" class="hp blue">HP 10 / 10</div><div id="bb" class="slot"></div><div id="bs" class="slot"></div><div id="bd" class="deck"></div></section></section></main><div id="overlay" class="hide"></div><script>var g;var overlay=document.getElementById('overlay');const $=x=>document.getElementById(x),A='assets/';const cards={rock:['グー','battle-rock.webp'],scissors:['チョキ','battle-scissors.webp'],paper:['パー','battle-paper.webp']};function img(src){return '<img src="'+A+src+'" alt="">'}function card(k){return cards[k]||['','card-back.webp']}function side(k,other){let s=g[k],mine=(document.body.dataset.me||g.me)===k;$(k==='r'?'rn':'bn').textContent=s.name||k;$(k==='r'?'rh':'bh').textContent='HP '+s.hp+' / 10';let b=$(k==='r'?'rb':'bb'),sp=$(k==='r'?'rs':'bs'),d=$(k==='r'?'rd':'bd');let chosen=k==='r'?g.rp:g.bp;b.innerHTML=chosen?'<div class="card">'+img(card(chosen)[1])+'</div><label>'+(g.phase==='reveal'?'OK!':card(chosen)[0])+'</label>':'<label>バトル山札</label>';sp.innerHTML=s.spell?'<div class="card">'+img(s.spell.image||'spell-back.webp')+'</div><label>'+s.spell.name+'</label>':'<label>スペルカード</label>';let can=mine&&g.phase==='open';d.innerHTML=can?'<button onclick="SH.draw(''+k+'')">バトルカードを引く</button>':'<span>'+((g.phase==='open')?(mine?'選択してください':'相手を待っています'):'')+'</span>';if(can&&s.hand){b.innerHTML='<div class="hand">'+s.hand.map(x=>'<button onclick="SH.pick(''+k+'',''+x+'')">'+img(card(x)[1])+'</button>').join('')+'</div><label>1枚選ぶ</label>'}}function render(){if(!g)return;side('r','b');side('b','r');$('msg').textContent=g.msg||'';let r=$('reveal');r.innerHTML=g.phase==='reveal'&&g.rp&&g.bp?'<div class="card">'+img(card(g.rp)[1])+'</div><div class="card">'+img(card(g.bp)[1])+'</div>':''}window.SHRender=render;function cpu(){return ['rock','scissors','paper'][Math.floor(Math.random()*3)]}function resolve(){let a=g.rp,b=g.bp;if(a===b)g.msg='あいこ。もう一度。';else{let win=(a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock');if(win){g.b.hp--;g.msg='勝利！ 青に1ダメージ。'}else{g.r.hp--;g.msg='敗北。 赤に1ダメージ。'}}g.phase='open';g.rp=g.bp=null;render()}window.SH={home(){location.reload()},story(){this.cpu()},cpu(){document.body.dataset.me='r';g={r:{name:'あなた',hp:10,hand:null,spell:null},b:{name:'CPU',hp:10,hand:null,spell:null},me:'r',online:false,phase:'open',rp:null,bp:null,msg:'赤側の山札を引いてください。'};$('title').classList.add('hide');$('app').classList.remove('hide');render()},online(){if(window.SHOnline)SHOnline.open()},draw(k){if(g.online)return SHOnline.controller.draw();g[k].hand=Array.from({length:4},cpu);g.msg='バトルカードを1枚選んでください。';render()},pick(k,x){if(g.online)return SHOnline.controller.pick(x);g.rp=x;g.bp=cpu();g.phase='reveal';g.msg='両者のカードを公開。';render();setTimeout(resolve,900)},use(){if(g.online)SHOnline.controller.use()},ok(){if(g.online)SHOnline.controller.ok()}};</script><script src="spell-hearts-online-client.js?v=rebuild-v8"></script></html>
