<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spell Heart</title>
  <style>
    :root{--gold:#e7bd58;--ink:#060912;--paper:#f8e6b8}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#05070d;color:var(--paper);font-family:Georgia,"Yu Mincho",serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    #app{min-height:100vh;background:#05070d center/cover fixed no-repeat}.screen{min-height:100vh;position:relative}.title{display:grid;place-items:center;background-image:linear-gradient(#0001,#0009),url("assets/title-screen.webp")}.title-panel{display:grid;gap:12px;justify-items:center}.logo{font-size:clamp(45px,9vw,118px);letter-spacing:.07em;color:#f7d273;text-shadow:0 3px 10px #000,0 0 24px #d99023}.menu,.dialogue,.battle-frame,.modal{border:1px solid var(--gold);background:linear-gradient(145deg,#161109e8,#05070df0);box-shadow:0 0 24px #000a,inset 0 0 22px #d3991d21}.menu{width:min(92vw,470px)}.choice,.primary,.secondary{width:100%;padding:15px;border:0;border-top:1px solid #8a6825;background:#0a0d11c9;color:var(--paper);letter-spacing:.1em}.choice:hover,.primary:hover{background:#443117}.primary{border:1px solid var(--gold);background:linear-gradient(#75571b,#211606);font-weight:bold}.secondary{border:1px solid #726b78;background:#24232b}.topbar{position:absolute;top:16px;left:clamp(14px,3vw,44px);right:clamp(14px,3vw,44px);z-index:8;display:flex;justify-content:space-between}.icon{width:auto;padding:9px 13px}
    .story{display:grid;grid-template-rows:1fr auto;overflow:hidden;background:#05070d center/cover no-repeat}.characters{position:relative;min-height:0}.portrait{position:absolute;bottom:8px;width:clamp(180px,23vw,365px);max-height:67vh;object-fit:contain;filter:drop-shadow(0 6px 7px #000);transition:opacity .25s}.portrait.left{left:clamp(4vw,14vw,18vw)}.portrait.right{right:clamp(4vw,14vw,18vw);transform:scaleX(-1)}.portrait.dim{opacity:.35}.dialogue{width:min(88vw,1060px);min-height:155px;margin:0 auto 45px;padding:17px 25px;position:relative;z-index:5}.speaker{display:inline-block;min-width:130px;margin-top:-41px;padding:9px 18px;border:1px solid var(--gold);background:#1d150b;color:#ffe08a}.line{font-size:clamp(17px,2.2vw,27px);line-height:1.7;min-height:75px}.next{position:absolute;right:20px;bottom:12px;color:#ffe18a;font-size:24px;animation:bob 1s infinite}@keyframes bob{50%{transform:translateY(5px)}}
    .battle{display:grid;place-items:center;padding:76px 12px 20px;background:#05070d center/cover fixed no-repeat}.battle-frame{width:min(1250px,100%);padding:14px;position:relative}.battle-head{display:flex;justify-content:space-between;font-size:clamp(20px,3vw,36px);font-weight:bold}.hp.player{color:#ffaaa3}.hp.cpu{color:#9de9ff}.board{position:relative;min-height:500px;background:url("assets/battlefield-transparent.webp") center/100% 100% no-repeat}.side{position:absolute;top:4%;width:25%;display:grid;gap:9px}.side.player{left:4%}.side.cpu{right:4%}.zone-title{color:#ebca75;font-size:13px;letter-spacing:.1em;text-align:center}.hand{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.card,.card-back{aspect-ratio:2/3;border:1px solid #d6b45b;background:#0a0a0f;overflow:hidden}.card{padding:0}.card img,.card-back img{width:100%;height:100%;object-fit:cover;display:block}.card.ready{outline:3px solid #ffe885;box-shadow:0 0 20px #e9bd37;animation:pulse 1.1s infinite}@keyframes pulse{50%{filter:brightness(1.4)}}.spell-row{display:flex;gap:7px;justify-content:center}.spell-row .card{width:43%}.arena{position:absolute;left:34%;right:34%;top:14%;bottom:20%;display:flex;align-items:center;justify-content:center;gap:7%;background:#0002}.played{width:42%;aspect-ratio:2/3;border:2px solid #e5c56c;background:#0a0a0f;overflow:hidden}.played img{width:100%;height:100%;object-fit:cover}.vs{position:absolute;font-size:clamp(24px,4vw,52px);color:#f7d777;text-shadow:0 2px 7px #000}.battle-message{position:absolute;bottom:6%;left:28%;right:28%;text-align:center;font-size:clamp(15px,2vw,22px);line-height:1.5}.battle-actions{display:flex;gap:12px;justify-content:center;margin-top:10px}.battle-actions button{width:auto;padding:10px 24px}.log{max-height:100px;overflow:auto;margin:12px 0 0;padding:8px;list-style:none;font-family:"Yu Gothic",sans-serif;font-size:13px;color:#dad2c2}.log li{padding:3px}
    .modal-layer{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#000b;padding:16px}.modal{width:min(92vw,600px);padding:24px}.modal h2{text-align:center;color:#ffe08a}.inventory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.inventory .card{position:relative}.equipped{outline:3px solid #ffe887}.small{font-size:13px;color:#d5c9ad;text-align:center}.fade{position:fixed;z-index:30;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .55s}.fade.on{opacity:1}.error{color:#ffaaa3}
    @media(max-width:700px){.portrait{width:31vw;bottom:88px}.portrait.left{left:2vw}.portrait.right{right:2vw}.dialogue{width:95vw;margin-bottom:20px}.battle{padding:62px 0 0}.battle-frame{padding:4px}.board{min-height:430px}.side{width:29%}.side.player{left:1%}.side.cpu{right:1%}.arena{left:31%;right:31%}.battle-message{left:25%;right:25%}.logo{font-size:15vw}}
  </style>
</head>
<body>
  <div id="app"></div><div id="fade" class="fade"></div>
  <script type="module" src="spell-hearts-auth.js?v=rebuild-7"></script>
</body>
</html>
