<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spell Hearts</title>
<style>:root{--g:#e6bd48;--r:#ffaaa4;--b:#9fe5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07101b url('assets/title-screen.webp') center/cover fixed;color:#fff4d2;font-family:Georgia,"Yu Mincho",serif}button{font:inherit}.hide{display:none!important}#title,.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#02050bdd}.logo{font-size:clamp(45px,8vw,100px);color:#f5d87d;text-shadow:0 4px 15px #000;letter-spacing:.08em}.menu,.panel{display:grid;gap:10px;width:min(84vw,430px);text-align:center}.menu button,.panel button,.top button,.actions button{padding:13px;border:1px solid var(--g);border-radius:5px;background:#090b12e8;color:#ffeab0;cursor:pointer}.menu button:hover,button:hover{filter:brightness(1.25)}#app{width:min(1480px,100%);margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;max-width:1360px;margin:auto}.top h1{color:#ffe9a7;letter-spacing:.12em}.board{display:grid;grid-template-columns:minmax(145px,19%) 1fr minmax(145px,19%);gap:18px;min-height:min(75vh,780px);max-width:1360px;margin:auto;padding:26px;border:2px solid var(--g);border-radius:18px;background:#06111dde url('assets/battlefield-transparent.webp') center/cover;box-shadow:0 0 30px #0008}.side{display:grid;grid-template-columns:repeat(2,1fr);align-content:start;gap:7px}.name{grid-column:1/-1;margin:0;padding:6px;border:1px solid #b99130;background:#05070cdd;text-align:center}.red .name{color:var(--r)}.blue .name{color:var(--b)}.slot{position:relative;aspect-ratio:2/3;overflow:hidden;border:1px solid #c49b38;border-radius:6px;background:#05060b}.slot img{width:100%;height:100%;object-fit:cover}.slot small{position:absolute;left:0;right:0;bottom:0;padding:4px;background:#05060be8;color:#ffe8a0;text-align:center}.deck{cursor:pointer}.deck.ready{outline:3px solid #ffe36e;box-shadow:0 0 20px #ffb72c}.ok{position:absolute!important;inset:0!important;display:grid!important;place-items:center!important;color:#fff2a6;font-size:clamp(32px,4vw,60px);font-weight:bold;-webkit-text-stroke:2px #704000;text-shadow:0 0 15px #ffad19}.hand{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.hand button{padding:0;border:1px solid var(--g);background:#080a11;aspect-ratio:2/3}.hand img{width:100%;height:100%;object-fit:cover}.field{display:grid;grid-template-rows:auto 1fr auto}.hp{display:flex;justify-content:space-between;font-size:clamp(17px,2.3vw,32px);font-weight:bold}.hr{color:var(--r)}.hb{color:var(--b)}.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:35px;padding:7% 3%}.played{justify-self:center;aspect-ratio:2/3;max-height:350px;border:2px solid var(--g);border-radius:8px;overflow:hidden;background:#05060b}.played img{width:100%;height:100%;object-fit:cover}.vs{font-size:clamp(24px,5vw,62px);color:#ffe79c}.msg,.info{text-align:center;color:#ffe4a0}.actions{text-align:center;margin:12px}.panel{padding:28px;border:1px solid var(--g);border-radius:9px;background:#111522}.dialogue{position:fixed;z-index:25;bottom:5vh;left:50%;transform:translateX(-50%);width:min(86vw,760px);padding:18px;border:1px solid var(--g);border-radius:8px;background:#080a11ee;cursor:pointer}.dialogue b{color:#ffdc7e}@media(max-width:720px){#app{padding:6px}.board{grid-template-columns:1fr;min-height:0;padding:10px}.field{grid-row:1}.side{grid-template-columns:repeat(4,1fr)}.side .slot{max-height:165px}.duel{min-height:290px}}</style>
</head><body><section id="title"><div><h1 class="logo">SPELL HEARTS</h1><div class="menu"><button onclick="SH.story()">STORY MODE</button><button onclick="SH.cpu()">CPU戦</button><button onclick="SH.online()">オンライン対戦</button></div></div></section><main id="app" class="hide"><header class="top"><h1>SPELL HEARTS</h1><button onclick="SH.title()">タイトルに戻る</button></header><section class="board"><aside id="left" class="side red"></aside><section class="field"><div class="hp"><span id="rh" class="hr"></span><span id="bh" class="hb"></span></div><div class="duel"><div id="rp" class="played"></div><b class="vs">VS</b><div id="bp" class="played"></div></div><div id="msg" class="msg"></div></section><aside id="right" class="side blue"></aside></section><p id="info" class="info"></p><p id="actions" class="actions"></p></main><div id="overlay" class="overlay hide"></div><div id="dialogue" class="dialogue hide"></div>
<script>
const A='assets/', C={rock:['グー','rock.webp',1],scissors:['チョキ','scissors.webp',2],paper:['パー','paper.webp',5],amplify:['アンプリファイア','amplify.webp',0]}, S={pursuit:['追い打ち','pursuit.webp'],block:['ブロック','block.webp'],scheme:['謀略','scheme.webp']};
const $=id=>document.getElementById(id), im=x=>`<img src="${A+x}" alt="">`, sh=a=>[...a].sort(()=>Math.random()-.5);
let g; window.SHOnlineSide=null; window.SHOnlineController=null;
const judge=(a,b)=>a===b?'d':a==='amplify'?'b':b==='amplify'?'r':(a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock')?'r':'b';
const makeSide=()=>({hp:10,deck:sh(Object.keys(S)),spell:null,name:''});
function init(){g={r:makeSide(),b:makeSide(),phase:'open',round:1,rp:null,bp:null,msg:'始まりのスペルカードをドローしてください。'};}
function slot(src,label,click,ok=false){return `<button class="slot deck ${click?'ready':''}" ${click?`onclick="${click}"`:''}>${im(src)}<small>${label}</small>${ok?'<b class="ok">OK!</b>':''}</button>`;}
function sideUI(k){
  const localSide=document.body.dataset.me||g.me||'r', s=g[k], me=k===localSide, chosen=k==='r'?g.rp:g.bp, who=document.body.dataset.online?(s.name||(me?'あなた':'相手')):(me?'あなた':'CPU');
  const choices=g.online?(g.hand||[]):Object.keys(C);
  const hand=g.phase==='pick'&&me&&!chosen?`<div class="hand">${choices.map(x=>`<button onclick="SH.pick('${x}')">${im(C[x][1])}<small>${C[x][0]}</small></button>`).join('')}</div>`:'';
  if(hand)return `<h2 class="name">${who}</h2>${hand}`;
  const battle=slot(k==='r'?'red-battle-back.webp':'blue-battle-back.webp','BATTLE CARD',g.phase==='spell'&&me?'SH.ok()':'',g.phase==='spell'&&me);
  const spell=s.spell?`<div class="slot">${im(S[s.spell][1])}<small>${S[s.spell][0]}</small></div>`:slot(k==='r'?'red-spell-back.webp':'blue-spell-back.webp','SPELL CARD',g.phase==='open'&&me?'SH.draw()':'');
  return `<h2 class="name">${who}</h2>${spell}${battle}`;
}
function render(){
  if(!g)return; $('rh').textContent=`HP ${g.r.hp} / 10`; $('bh').textContent=`HP ${g.b.hp} / 10`;
  $('left').innerHTML=sideUI('r'); $('right').innerHTML=sideUI('b'); $('rp').innerHTML=g.rp?im(C[g.rp][1]):''; $('bp').innerHTML=g.bp?im(C[g.bp][1]):'';
  $('msg').textContent=g.msg||''; const mine=g[document.body.dataset.me||g.me||'r']; $('info').textContent=mine.spell?`伏せスペル：${S[mine.spell][0]}`:'';
  $('actions').innerHTML=g.phase==='spell'&&mine.spell&&(!g.online||g.canUse)?`<button onclick="SH.spell()">${S[mine.spell][0]}を使う</button>`:'';
}
function draw(){if(g.online)return window.SHOnline.controller.draw(); g.r.spell=g.r.deck.pop();g.b.spell=g.b.deck.pop();g.phase='pick';g.msg=`ROUND ${g.round} ― バトルカードを選択`;render();}
function pick(x){if(g.online)return window.SHOnline.controller.pick(x);if(g.rp)return;g.rp=x;g.msg='CPUが選んでいます…';render();setTimeout(()=>{g.bp=Object.keys(C)[Math.random()*4|0];g.phase='spell';g.msg=`${C[g.rp][0]} 対 ${C[g.bp][0]}`;render();},500);}
function spell(){if(g.online)return window.SHOnline.controller.use();const x=g.r.spell;if(x==='pursuit'&&judge(g.rp,g.bp)==='r')g.b.hp--;if(x==='block'&&judge(g.rp,g.bp)==='b')g.r.hp=Math.min(10,g.r.hp+1);g.r.spell=g.r.deck.pop()||null;render();}
function ok(){if(g.online)return window.SHOnline.controller.ok();const w=judge(g.rp,g.bp);if(w==='r')g.b.hp-=C[g.rp][2];if(w==='b')g.r.hp-=C[g.bp][2];if(w==='d'){g.r.hp--;g.b.hp--;}if(g.r.hp<=0||g.b.hp<=0){g.msg=g.r.hp===g.b.hp?'DRAW':g.r.hp>g.b.hp?'YOU WIN':'CPU WIN';render();$('overlay').innerHTML=`<div class="panel"><h2>${g.msg}</h2><button onclick="SH.cpu()">もう一度</button><button onclick="SH.title()">タイトルへ</button></div>`;$('overlay').classList.remove('hide');return;}g.round++;g.rp=g.bp=null;g.phase='pick';g.msg=`ROUND ${g.round} ― バトルカードを選択`;render();}
window.SHRender=render;
window.SH={cpu(){window.SHOnlineController?.close();window.SHOnlineController=null;window.SHOnlineSide=null;delete document.body.dataset.me;delete document.body.dataset.online;init();$('title').classList.add('hide');$('app').classList.remove('hide');$('overlay').classList.add('hide');render();},draw,pick,spell,ok,title(){window.SHOnlineController?.close();window.SHOnlineController=null;window.SHOnlineSide=null;delete document.body.dataset.me;delete document.body.dataset.online;$('app').classList.add('hide');$('overlay').classList.add('hide');$('dialogue').classList.add('hide');$('title').classList.remove('hide');},online(){window.SHOnline?.open();},story(){window.SHStory?.open()}};
</script><script src="spell-hearts-auth.js?v=rebuild-v7"></script><script src="spell-hearts-online-client.js?v=rebuild-v7"></script>
</body></html>
